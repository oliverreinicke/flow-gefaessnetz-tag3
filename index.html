<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1428"><title>FLOW · Mission Gefässnetz</title><style>
:root{color-scheme:dark;--bg:#0b1222;--panel:#141f35;--line:#2b3953;--muted:#a8b8d0;--mint:#77f2c3;--red:#ff8294;--blue:#86baff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 10%,#233851 0,transparent 45%),var(--bg);color:#f3f6ff;font:16px/1.6 system-ui,-apple-system,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);color:inherit;background:#1a2943;border-radius:14px;padding:13px 20px;transition:transform .15s,background .15s}button:hover{background:#293c59;transform:translateY(-2px)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:4px}button:disabled{cursor:default;opacity:.6;transform:none}.primary{background:var(--mint);color:#0b2623;font-weight:800;border:0}.primary:hover{background:#a1ffdd}a{color:var(--mint)}header{max-width:1240px;margin:auto;padding:25px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{letter-spacing:6px;font-weight:950;font-size:28px}.logo span{color:var(--mint)}.tag{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase}.shell{max-width:1180px;margin:auto;padding:15px 30px 65px}.hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;min-height:490px;gap:35px}h1{font-size:clamp(48px,7vw,88px);letter-spacing:-5px;line-height:1.02;margin:18px 0 24px}h1 em{font-style:normal;color:var(--mint)}h2{font-size:clamp(26px,3.4vw,39px);line-height:1.16;letter-spacing:-1px;margin:14px 0 20px}h3{margin:0 0 12px}p{margin:12px 0}.muted{color:var(--muted)}.intro{max-width:530px;font-size:18px}.chips{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}.chip{font-size:13px;color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:30px}.art{position:relative;min-height:430px;display:grid;place-items:center}.art svg{width:100%;filter:drop-shadow(0 0 35px #66dabb22)}.floating{position:absolute;background:#18263de8;border:1px solid #456078;border-radius:16px;padding:12px 17px;box-shadow:0 15px 35px #0004;font-size:13px}.floating b{display:block;color:var(--mint);font-size:20px}.f1{top:22px;right:0}.f2{bottom:30px;left:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:23px;background:linear-gradient(145deg,#1c2b43,#111c30);border:1px solid var(--line);border-radius:22px}.card .num{color:var(--mint);font-size:25px;font-weight:800}.card p{color:var(--muted);font-size:14px}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:22px}.track{height:7px;background:#26334a;border-radius:10px;overflow:hidden;margin:12px 0}.track div{height:100%;background:linear-gradient(90deg,var(--blue),var(--mint));transition:width .5s}.layout{display:grid;grid-template-columns:230px 1fr;gap:27px;align-items:start}.map{position:sticky;top:20px}.node{padding:15px;border-left:2px solid #34435c;margin-left:10px;color:var(--muted);font-size:14px}.node.active{border-color:var(--mint);background:#77f2c30c;color:white;border-radius:0 14px 14px 0}.node.done{color:var(--mint)}.node b{display:block}.workspace{min-width:0}.question{background:linear-gradient(145deg,#1a2940,#111b2e);border:1px solid var(--line);border-radius:26px;padding:30px}.brief{background:#0b1527;padding:18px 22px;border-radius:16px;border-left:3px solid var(--blue);margin:20px 0}.choices{display:grid;gap:11px;margin:24px 0}.choice{text-align:left;display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px}.marker{border:1px solid #60718d;border-radius:7px;min-width:27px;height:27px;display:grid;place-items:center;font-size:13px}.selected{background:#77f2c31c;border-color:var(--mint)}.selected .marker{background:var(--mint);color:#102221;border-color:var(--mint)}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:25px}.feedback{margin-top:24px;background:#77f2c30d;border:1px solid #77f2c350;border-radius:18px;padding:23px;scroll-margin:20px}.feedback.wrong{background:#ff82940b;border-color:#ff82945c}.feedback h3{color:var(--mint)}.feedback.wrong h3{color:var(--red)}.row{padding:16px;background:#0d192d;border-radius:14px;display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:center;margin:12px 0}select{background:#23334e;border:1px solid #526582;color:white;border-radius:10px;padding:12px;width:100%;min-width:0}.order{display:flex;align-items:center;gap:12px;margin:10px 0;background:#0d192d;border-radius:14px;padding:12px}.order span{flex:1}.order button{padding:5px 13px}.vessel{width:100%;height:150px}.slider{width:100%;accent-color:var(--mint);margin:20px 0}.readout{display:flex;justify-content:space-between;color:var(--mint);font-weight:800}.sectionhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.bigscore{font-size:76px;letter-spacing:-4px;color:var(--mint);font-weight:900;line-height:1.2}.resultgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:30px 0}.resultgrid .card{padding:15px;font-size:13px}.notice{color:var(--muted);font-size:13px;margin-top:24px}details{margin-top:22px;color:var(--muted);font-size:13px}summary{cursor:pointer}footer{max-width:1180px;margin:auto;padding:20px 30px 40px;color:var(--muted);font-size:12px}.pulse{animation:pulse 3s ease-in-out infinite}.flowline{stroke-dasharray:8 16;animation:stream 2s linear infinite}@keyframes stream{to{stroke-dashoffset:-120}}@keyframes pulse{50%{opacity:.45}}@media(max-width:800px){.hero{grid-template-columns:1fr;gap:0}.art{min-height:300px;max-width:430px;margin:auto;width:100%}h1{letter-spacing:-3px}.cards{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.map{position:static;display:flex;overflow:auto}.node{min-width:145px;margin:0;border-left:0;border-bottom:2px solid #34435c;padding:10px}.node.active{border-radius:12px 12px 0 0}.resultgrid{grid-template-columns:1fr 1fr}.shell{padding:10px 18px 40px}header{padding:20px 18px}.question{padding:22px 18px}.row{grid-template-columns:1fr}.tag{letter-spacing:1px}.topbar{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media print{header,.actions,.map,footer{display:none}body{background:white;color:black}.card,.question{background:white;color:black}.muted{color:#444}}
</style></head><body><header><div class="logo">FL<span>O</span>W<span>↗</span></div><div class="tag">FaGe · 3. Semester · Tag 3</div></header><main id="app" class="shell"></main><footer>FLOW · Mission Gefässnetz · Ein Lernspiel zur Konsolidierung. Keine Patientendaten eingeben. Dein Spielstand wird nur lokal in diesem Browser gespeichert.</footer>
<script>
'use strict';
const sectors=['Gefäss-Scanner','Code Virchow','Flug nach Bangkok','Venenwerkstatt','Arterien-Finale'];
const Q=[];
function add(s,type,title,prompt,options,answer,explain,extra={}){Q.push({s,type,title,prompt,options,answer,explain,...extra})}
add(0,'choice','Ein Gerinnsel im System','Was beschreibt eine Thrombose fachlich korrekt?',['Ein Blutgerinnsel entsteht im Gefäss und verengt oder verschliesst es.','Eine Arterie erweitert sich durch undichte Venenklappen.','Blut verlässt grundsätzlich das Gefäss und sammelt sich im Gewebe.','Jede Entzündung einer Vene ohne Gerinnsel.'],[0],'Ein Thrombus ist ein Blutgerinnsel innerhalb eines Gefässes. Thrombosen können Venen und Arterien betreffen. Hier steht zunächst die tiefe Beinvenenthrombose im Fokus.');
add(0,'match','Hinweg oder Rückweg?','Ordne die Folgen dem jeweils betroffenen Gefässsystem zu.',['Rücktransport zum Herzen behindert; Blut staut sich im Bein.','Weniger sauerstoffreiches Blut erreicht die Beinmuskeln.','Einseitige Schwellung und Wärme passen eher dazu.','Kalter Fuss und Belastungsschmerz passen eher dazu.'],[0,1,0,1],'Venen führen Blut zurück zum Herzen; Arterien versorgen das Bein. Ein venöses Hindernis führt eher zum Rückstau, ein arterielles eher zur Minderversorgung. Die Zeichen allein sichern keine Diagnose.',{labels:['Venen','Arterien']});
add(0,'multi','Scanner: Thromboseverdacht','Welche drei Beobachtungen passen zu einer tiefen Beinvenenthrombose? Wähle drei.',['Neu einseitig geschwollenes Bein','Schmerz oder Spannungsgefühl in Wade/Bein','Überwärmung oder veränderte Hautfarbe','Beidseitig kalte Füsse beweisen eine Thrombose','Nur sichtbare Krampfadern, immer ohne weitere Abklärung'],[0,1,2],'Eine tiefe Venenthrombose kann einseitige Schwellung, Schmerz und Wärme verursachen, aber auch symptomarm bleiben. Bei Verdacht braucht es rasche ärztliche Abklärung.');
add(0,'order','Die gefährliche Reise','Bringe den Weg einer möglichen Lungenembolie in die richtige Reihenfolge.',['Teil eines Thrombus löst sich in einer tiefen Beinvene.','Das Gerinnsel reist über die grossen Venen zum rechten Herzen.','Es gelangt vom rechten Herzen in die Lungenarterien.','Es verschliesst ein Lungengefäss: Lungenembolie.'],[0,1,2,3],'Ein abgelöster Thrombus wird zum Embolus. Er kann über das rechte Herz ein Lungengefäss verschliessen – eine potenziell lebensbedrohliche Komplikation.');
add(1,'multi','Drei Codes. Ein Risiko.','Welche drei Faktoren bilden die Virchow-Trias?',['Verlangsamter oder gestörter Blutfluss','Schädigung der Gefässinnenwand','Erhöhte Gerinnungsneigung','Niedriger Puls als eigenständiger Trias-Faktor','Verminderte Sauerstoffsättigung als eigenständiger Trias-Faktor'],[0,1,2],'Die Trias beschreibt Stase/gestörten Blutfluss, Endothelschädigung und Hyperkoagulabilität. Mehrere Faktoren können zusammenwirken.');
add(1,'match','Knacke den Virchow-Code','Ordne jeden Mechanismus dem wichtigsten Trias-Faktor zu.',['Lange Immobilität: Die Muskelpumpe arbeitet kaum.','Verletzung der Gefässinnenwand durch einen Eingriff.','Angeborene Thrombophilie: Blut gerinnt leichter.','Undichte Venenklappen: Rückfluss und Blutstau.'],[0,1,2,0],'Immobilität und Klappeninsuffizienz begünstigen Stase. Eine Gefässverletzung betrifft die Innenwand. Thrombophilie erhöht die Gerinnungsneigung.',{labels:['Blutfluss / Stase','Gefässinnenwand','Gerinnungsneigung']});
add(1,'choice','Muskelpumpe aktivieren','Eine gesunde Reisende sitzt seit Stunden. Welche Handlung verbessert den venösen Rückstrom am direktesten?',['Fussgelenke regelmässig bewegen und bei Gelegenheit aufstehen.','Die Beine möglichst unbewegt lassen.','Die Wade kräftig massieren, falls sie neu schmerzt.','Vorsorglich ohne Verordnung Gerinnungshemmer einnehmen.'],[0],'Bewegung aktiviert die Wadenmuskelpumpe. Die Venenklappen unterstützen den gerichteten Rückstrom. Das ist Prophylaxe bei Beschwerdefreiheit; neue Beschwerden verlangen Abklärung.');
add(1,'match','Risiko-Radar','Welcher Mechanismus steht jeweils im Vordergrund?',['Bettruhe nach Operation: fehlende Muskelaktivität.','Östrogenhaltige kombinierte Pille: Veränderung der Gerinnung.','Entzündung/Verletzung an der Gefässinnenwand.'],[0,2,1],'Risikofaktoren sind keine sicheren Diagnosen. Ein konkreter Fall kann mehrere Trias-Faktoren gleichzeitig betreffen.',{labels:['Stase','Innenwandschädigung','Gerinnungsneigung']});
const lena='Lena ist 23. Sie raucht regelmässig, nimmt die Antibabypille und sitzt auf dem mittleren Platz eines 11-Stunden-Flugs nach Bangkok. Beim Aufstehen schmerzt ihr linkes Bein.';
add(2,'multi','11 Stunden. Sitz 24B.','Welche Angaben aus Lenas Fall sind relevante Thromboserisiken? Wähle drei.',['Langes Sitzen mit wenig Bewegung','Rauchen','Einnahme einer östrogenhaltigen kombinierten Pille, falls diese gemeint ist','Das Reiseziel Bangkok an sich','Ihr Alter von 23 Jahren allein als Hochrisikofaktor'],[0,1,2],'Langes Sitzen begünstigt Stase. Rauchen ist ein zusätzlicher Gefässrisikofaktor. Östrogenhaltige kombinierte Pillen erhöhen die venöse Gerinnungsneigung; nicht alle Verhütungsmittel haben dasselbe Risiko. Im Originalfall ist das Präparat nicht genannt.',{brief:lena});
add(2,'match','Lenas Trias','Ordne die vereinfachten Wirkmechanismen zu.',['Wenig Beinbewegung während elf Stunden.','Östrogenhaltige kombinierte Pille (angenommener Präparatetyp).','Rauchen: Schädigung des Endothels als vereinfachter Gefässmechanismus.'],[0,2,1],'Langes Sitzen → Stase; östrogenhaltige kombinierte Pille → Gerinnungsneigung. Rauchen kann Gefässschäden begünstigen und wirkt komplex. Die Zuordnung ist ein Lernmodell, kein Beweis einer akuten Wandschädigung bei Lena.',{labels:['Blutfluss / Stase','Gefässinnenwand','Gerinnungsneigung']});
add(2,'choice','Du entscheidest: neuer Beinschmerz','Was ist bei Lenas neuem einseitigem Beinschmerz und den Risikofaktoren die sinnvollste nächste Handlung?',['Kabinenpersonal informieren und rasche medizinische Abklärung organisieren.','Die Wade kräftig massieren, bis der Schmerz weg ist.','Lena zu einem intensiven Gehtraining auffordern.','Bis nach den Ferien abwarten.'],[0],'Ein Thromboseverdacht muss rasch medizinisch beurteilt werden. Schmerz allein beweist keine Thrombose. Nicht massieren und keine eigenständigen Medikamente oder Trainingsprogramme beginnen.',{brief:'Du bist mit Lena unterwegs. Der Schmerz ist neu. Du stellst keine Diagnose – du wählst die nächste sichere Handlung.'});
add(2,'choice','Alarm über den Wolken','Lena bekommt zusätzlich plötzlich Atemnot und Brustschmerz. Was tust du?',['Sofort Kabinenpersonal alarmieren und die medizinische Notfallkette auslösen.','Nur Wasser anbieten und abwarten.','Lena zum schnellen Umherlaufen auffordern.','Nur das Bein hochlagern und schlafen lassen.'],[0],'Atemnot und Brustschmerz bei möglicher Thrombose sind Alarmzeichen einer Lungenembolie. Sofort Notfallhilfe veranlassen. In der Schweiz gilt an Land die Sanitätsnotrufnummer 144.');
add(3,'choice','Die undichte Schleuse','Was passiert bei einer Varikosis?',['Oberflächliche Venen erweitern und schlängeln sich; Klappen schliessen oft nicht mehr ausreichend.','Beinarterien werden ausschliesslich durch einen frischen Thrombus erweitert.','Alle Venenklappen verschwinden von Geburt an.','Die Lungenarterie wird zu einer oberflächlichen Beinvene.'],[0],'Krampfadern sind erweiterte, geschlängelte oberflächliche Venen. Eine unzureichende Klappenfunktion begünstigt Rückfluss und erhöhten venösen Druck. Schweregefühl und Schwellungen sind möglich.');
add(3,'choice','Warum steigt das Risiko?','Welcher Teil der Virchow-Trias erklärt am direktesten das erhöhte Thromboserisiko bei Varikosis?',['Gestörter Blutfluss: Rückfluss und Stau in erweiterten Venen.','Mehr Sauerstoff im arteriellen Blut.','Automatisch eine angeborene Gerinnungsstörung.','Ein vollständiger Stillstand des Herzens.'],[0],'Erweiterung und unzureichende Klappenfunktion können den gerichteten Rückstrom beeinträchtigen. Der zentrale Bezug zur Trias ist der gestörte Blutfluss.');
add(3,'multi','Venenwerkstatt: Werkzeug wählen','Eine Person hat abgeklärte Varikosis ohne akute Thrombose. Welche drei Massnahmen passen?',['Regelmässige Bewegung und Aktivierung der Muskelpumpe','Beine in Ruhe bei Bedarf hochlagern','Passende Kompression nach fachlicher Abklärung und Empfehlung','Langes unbewegtes Stehen als Training','Kompression ohne Prüfung auch bei schwerer arterieller Durchblutungsstörung'],[0,1,2],'Bewegung, Hochlagern und fachlich empfohlene Kompression können venöse Beschwerden lindern. Arterielle Durchblutung und mögliche Gegenanzeigen müssen vor einer Kompression berücksichtigt werden.');
add(3,'match','Tief oder oberflächlich?','Ordne die Beschreibungen zu.',['Gerinnsel in einer tiefen Beinvene.','Entzündeter, schmerzhafter oberflächlicher Venenstrang mit Gerinnsel.','Kann Ausgangspunkt einer Lungenembolie sein.'],[0,1,0],'Phlebothrombose betrifft tiefe Venen. Thrombophlebitis betrifft hier oberflächliche Venen mit Entzündung und Thrombus. Auch eine oberflächliche Thrombose braucht Abklärung, weil sie sich ausdehnen kann.',{labels:['Phlebothrombose','Thrombophlebitis']});
add(3,'multi','Behandlung ist Teamarbeit','Eine tiefe Venenthrombose wurde bestätigt. Welche drei Aussagen passen zur Versorgung?',['Verordnete Antikoagulation korrekt durchführen; auf Blutungszeichen achten.','Schmerz, Schwellung und Veränderungen beobachten und weitergeben.','Mobilisation und gegebenenfalls Kompression nach Behandlungsplan umsetzen.','Für jede Person gilt zwingend wochenlange strikte Bettruhe.','Den Thrombus durch kräftige Massage lösen.'],[0,1,2],'Antikoagulation reduziert Wachstum und neue Gerinnsel. Pflege beobachtet Verlauf und Nebenwirkungen. Mobilisation und Kompression werden individuell abgestimmt; pauschale strikte Bettruhe ist kein heutiger Standard.');
add(3,'multi','Oberflächlich heisst nicht egal','Ein schmerzhafter, geröteter, harter Venenstrang fällt auf. Welche drei Schritte passen?',['Ärztlich abklären lassen und Ausdehnung beurteilen lassen.','Beschwerden beobachten; vereinbarte Bewegung und Hochlagerung unterstützen.','Verordnete entzündungshemmende oder gerinnungshemmende Behandlung umsetzen.','Immer harmlos: nie melden.','Starke Massage direkt auf dem Venenstrang.'],[0,1,2],'Bei oberflächlicher Thrombophlebitis werden Ausdehnung und Nähe zum tiefen System beurteilt. Behandlung und Kompression hängen vom Befund ab. Pflege unterstützt den Plan und meldet Verschlechterungen.');
add(4,'sim','Flow-Labor: eng wird kritisch','Verändere die Gefässverengung mindestens einmal. Was geschieht bei zunehmender Verengung einer Beinarterie?',['Die Versorgung hinter der Engstelle wird beeinträchtigt.','Die Engstelle verbessert automatisch die Sauerstoffversorgung.','Es entsteht ausschliesslich venöser Rückstau.','Die Muskelversorgung ist von Arterien unabhängig.'],[0],'Bei PAVK verengen meist atherosklerotische Ablagerungen die Arterien. Unter Belastung reicht die Sauerstoffversorgung der Muskeln oft nicht aus. Das Modell ist schematisch; es berechnet keinen klinischen Blutfluss.');
add(4,'order','Vom Plaque zum Schmerz','Ordne die Ursache-Wirkungs-Kette bei stabiler PAVK.',['Atherosklerotische Ablagerungen verengen eine Beinarterie.','Unter Belastung steigt der Sauerstoffbedarf der Muskulatur.','Die verengte Arterie kann den Mehrbedarf nicht ausreichend decken.','Schmerz zwingt zum Anhalten; in Ruhe sinkt der Bedarf und der Schmerz lässt nach.'],[0,1,2,3],'Betroffen sind Arterien. Der wiederkehrende Belastungsschmerz mit Gehpausen erklärt den Namen „Schaufensterkrankheit“: Betroffene bleiben stehen, als würden sie Auslagen anschauen.');
add(4,'multi','Arterien-Risiko-Radar','Welche vier Faktoren fördern eine atherosklerotische PAVK?',['Rauchen','Diabetes mellitus','Arterielle Hypertonie','Erhöhte Blutfette','Regelmässige angepasste Bewegung','Gut eingestellter Blutdruck als eigenständiger Risikofaktor'],[0,1,2,3],'Rauchen, Diabetes, hoher Blutdruck und erhöhte Blutfette sind wichtige beeinflussbare Risikofaktoren. Hinzu kommen unter anderem Alter und familiäre Veranlagung.');
add(4,'multi','Dein Behandlungsplan','Eine Person hat stabile PAVK mit Belastungsschmerz, ohne Ruheschmerz oder Wunden. Welche drei Massnahmen passen?',['Rauchstopp unterstützen und Risikofaktoren behandeln lassen.','Ärztlich abgestimmtes, möglichst strukturiertes Gehtraining.','Verordnete Medikamente und Fusskontrollen; bei Bedarf Gefässeingriff abklären.','Alle Bewegung dauerhaft vermeiden.','Heisse Wärmflasche direkt an schlecht durchblutete Füsse legen.'],[0,1,2],'Bei stabiler PAVK können Rauchstopp, strukturiertes Gehtraining und medikamentöse Risikoreduktion helfen. Füsse schützen und kontrollieren. Ruheschmerz, Wunden oder akute Veränderungen benötigen erneute Abklärung; keine direkte starke Hitze.');
add(4,'multi','Schaufenster-Scanner','Welche drei Beobachtungen passen zu einer chronischen arteriellen Minderdurchblutung der Beine?',['Wadenschmerz beim Gehen, der nach einer Pause nachlässt','Kühler Fuss und schwach tastbare Fusspulse','Schlecht heilende Wunden im fortgeschrittenen Stadium','Ein heisser, harter oberflächlicher Venenstrang als typisches PAVK-Leitsymptom','Nur erweiterte, geschlängelte oberflächliche Venen'],[0,1,2],'PAVK kann Belastungsschmerz, kühle Haut und schwache Pulse verursachen. Wunden oder Ruheschmerz sprechen für fortgeschrittene Erkrankung und brauchen zeitnahe Beurteilung. Ein heisser Venenstrang passt eher zur Thrombophlebitis.');
add(4,'choice','Finale: erkenne den Notfall','Ein Fuss wird plötzlich sehr schmerzhaft, blass, kalt und taub. Wie reagierst du?',['Sofort medizinische Notfallhilfe organisieren: möglicher akuter arterieller Verschluss.','Ein intensives Gehtraining starten.','Ohne Abklärung fest komprimieren.','Bis zum nächsten regulären Termin warten.'],[0],'Plötzliche Schmerzen, Blässe, Kälte und Gefühlsverlust können einen akuten arteriellen Verschluss anzeigen. Das ist ein zeitkritischer Notfall. Diese Situation unterscheidet sich von stabiler PAVK mit Belastungsschmerz.');
const KEY='flow-tag3-v1';let state={pos:0,results:[],started:0,elapsed:0,phase:'intro',queue:[],retry:0};let chosen=[],order=[],checked=false,touched=false,clockStart=Date.now(),saveOK=true;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.v===1&&Array.isArray(saved.results)&&saved.results.length<=Q.length&&Number.isInteger(saved.pos)&&saved.pos>=0&&saved.pos<=Q.length&&['intro','play','result','retry'].includes(saved.phase)&&Array.isArray(saved.queue)&&saved.queue.every(x=>Number.isInteger(x)&&x>=0&&x<Q.length)){state={...state,...saved};if(state.phase==='retry'&&state.retry>=state.queue.length)state.phase='result';}}catch(e){saveOK=false}
const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function time(){return state.elapsed+(state.phase==='play'||state.phase==='retry'?Math.floor((Date.now()-clockStart)/1000):0)}function save(){const t=time();state.elapsed=t;clockStart=Date.now();try{localStorage.setItem(KEY,JSON.stringify({...state,v:1}))}catch(e){saveOK=false}}
function art(){return `<svg viewBox="0 0 500 430" role="img" aria-label="Stilisiertes Gefässnetz mit leuchtenden Blutbahnen"><defs><linearGradient id="g"><stop stop-color="#86baff"/><stop offset="1" stop-color="#77f2c3"/></linearGradient></defs><circle cx="250" cy="215" r="170" fill="none" stroke="#86baff18"/><circle cx="250" cy="215" r="120" fill="none" stroke="#86baff22"/><g fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round"><path d="M245 395 V285 Q245 245 200 225 L110 180 Q75 165 75 115 V50"/><path d="M245 285 Q245 245 290 225 L380 180 Q415 165 415 115 V50"/><path d="M245 245 V60"/></g><g fill="none" stroke="#e7fff7" stroke-width="3" class="flowline"><path d="M245 395 V285 Q245 245 200 225 L110 180 Q75 165 75 115 V50"/><path d="M245 285 Q245 245 290 225 L380 180 Q415 165 415 115 V50"/><path d="M245 245 V60"/></g><circle class="pulse" cx="245" cy="245" r="36" fill="#77f2c326"/><circle cx="245" cy="245" r="11" fill="#d4ffee"/></svg>`}
function intro(){app.innerHTML=`<div class="hero"><div><div class="tag" style="color:var(--mint)">Mission Gefässnetz · ca. 20 Minuten</div><h1>Keep the<br><em>flow alive.</em></h1><p class="intro muted">Ein Flug nach Bangkok. Ein verdächtiger Beinschmerz. Ein Gefässnetz, das dein Wissen braucht.</p><div class="chips"><span class="chip">24 Challenges</span><span class="chip">5 Sektoren</span><span class="chip">Deine Entscheidungen zählen</span></div><button class="primary" id="start">${state.pos>0?'Mission fortsetzen ↗':'Mission starten ↗'}</button>${state.pos>0?'<button id="reset" style="margin-left:10px">Neu starten</button>':''}</div><div class="art">${art()}<div class="floating f1"><span class="tag">Gefässnetz</span><b>Bereit für deinen Scan</b></div><div class="floating f2"><span class="tag">Dein Auftrag</span><b>Erkennen. Verstehen. Handeln.</b></div></div></div><div class="cards"><div class="card"><div class="num">01 / Scan</div><h3>Check die Signale.</h3><p>Unterscheide venöse und arterielle Probleme. Erkenne Risiken und Warnzeichen.</p></div><div class="card"><div class="num">02 / Decide</div><h3>Übernimm die Mission.</h3><p>Knacke die Trias, begleite Lena und stelle passende Massnahmen zusammen.</p></div><div class="card"><div class="num">03 / Master</div><h3>Mach Fehler zu Wissen.</h3><p>100 XP pro richtiger Erstlösung. Feedback nach jeder Aufgabe, Trainingsrunde für offene Themen. Ohne Zeitdruck.</p></div></div><p class="notice">Plane etwa 20 Minuten inklusive Lesen und Begründen ein. Die Uhr ist eine Orientierung, kein Zeitlimit. Alles funktioniert offline, ohne Anmeldung oder externe Bibliotheken.</p>${sources()}`;document.getElementById('start').onclick=()=>{state.phase=state.resumePhase||'play';state.started=state.started||Date.now();clockStart=Date.now();save();render()};if(document.getElementById('reset'))document.getElementById('reset').onclick=reset}
function sources(){return `<details><summary>Grundlagen & fachliche Hinweise</summary><p>Inhalte nach „VorwissenTag 3“, „ErarbeitungTag 3“ und „LernkontrollfragenTag 3“. Die Unterlagen enthalten Aufgaben, keine vollständigen Musterlösungen. Der dort genannte Fall Frau Waals ist nicht mitgeliefert; im Spiel wird der vorliegende Fall Lena verwendet. Ergänzende Aufgaben sind didaktisch formuliert.</p><p>Fachlicher Abgleich (11.10.2026): <a target="_blank" rel="noopener" href="https://www.nhs.uk/conditions/deep-vein-thrombosis-dvt/">NHS: tiefe Venenthrombose</a> · <a target="_blank" rel="noopener" href="https://www.nhs.uk/conditions/varicose-veins/">Varikosis</a> · <a target="_blank" rel="noopener" href="https://www.nhs.uk/conditions/phlebitis/">Thrombophlebitis</a> · <a target="_blank" rel="noopener" href="https://www.nhs.uk/conditions/peripheral-arterial-disease-pad/">PAVK</a> · <a target="_blank" rel="noopener" href="https://www.nhs.uk/conditions/peripheral-arterial-disease-pad/treatment/">PAVK-Behandlung</a>.</p><p>Unterrichtsspiel, keine Diagnosehilfe. Massnahmen richten sich in der Praxis nach Befund, Zuständigkeit, Verordnung und lokalen Standards. Die schematischen Gefässe sind keine anatomischen Abbildungen.</p></details>`}
function reset(){state={pos:0,results:[],started:0,elapsed:0,phase:'intro',queue:[],retry:0};save();render()}
function currentIndex(){return state.phase==='retry'?state.queue[state.retry]:state.pos}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){if(state.phase==='intro')return intro();if(state.phase==='result'||(state.phase==='play'&&state.pos>=Q.length))return result();const q=Q[currentIndex()];chosen=[];checked=false;touched=false;order=shuffle(q.options.map((_,i)=>i));if(q.type==='order'&&order.every((v,i)=>v===i))order.reverse();let xp=state.results.filter(r=>r.ok).length*100;app.innerHTML=`<div class="topbar"><span class="tag">${state.phase==='retry'?'Training · '+(state.retry+1)+' / '+state.queue.length:'Mission · '+(state.pos+1)+' / '+Q.length}</span><span><b style="color:var(--mint)">${xp} XP</b> <span class="muted"> · <span id="timer"></span></span></span><button id="pause">Pause & Übersicht</button></div><div class="track"><div style="width:${state.pos/Q.length*100}%"></div></div><div class="layout"><aside class="map" aria-label="Missionsfortschritt">${sectors.map((s,i)=>`<div class="node ${i===q.s?'active':i<q.s?'done':''}"><span>SEKTOR 0${i+1}</span><b>${s}</b></div>`).join('')}</aside><div class="workspace"><section class="question"><div class="sectionhead"><span class="tag" style="color:var(--mint)">${({choice:'Entscheidung',multi:'Werkzeug-Check',match:'Code-Zuordnung',order:'Kettenreaktion',sim:'Interaktives Labor'})[q.type]}</span><span class="muted">${state.phase==='retry'?'Training':'100 XP'}</span></div><h2 tabindex="-1" id="qtitle">${esc(q.title)}</h2>${q.brief?'<div class="brief">'+esc(q.brief)+'</div>':''}<p>${esc(q.prompt)}</p><div id="task"></div><div class="actions"><button class="primary" id="check">Entscheidung prüfen</button><span id="validation" role="status" class="muted"></span></div><div id="feedback" aria-live="polite"></div></section><p class="notice">${saveOK?'Automatisch lokal gespeichert.':'Speicherung ist in diesem Browser nicht verfügbar. Lass die Seite geöffnet.'} Alle Aufgaben lassen sich mit Tastatur oder Touch lösen.</p></div></div>`;task(q);document.getElementById('check').onclick=check;document.getElementById('pause').onclick=()=>{save();state.resumePhase=state.phase;state.phase='intro';save();render()};document.getElementById('qtitle').focus({preventScroll:true});tick();window.scrollTo({top:0,behavior:'instant'})}
function task(q){let el=document.getElementById('task');if(q.type==='match'){el.innerHTML=q.options.map((o,i)=>`<label class="row"><span>${esc(o)}</span><select data-i="${i}" aria-label="Zuordnung: ${esc(o)}"><option value="">Bitte zuordnen …</option>${q.labels.map((l,j)=>`<option value="${j}">${esc(l)}</option>`).join('')}</select></label>`).join('');el.querySelectorAll('select').forEach(s=>s.onchange=()=>chosen[Number(s.dataset.i)]=s.value===''?undefined:Number(s.value));return}if(q.type==='order'){paintOrder();return}el.innerHTML=(q.type==='sim'?`<div class="brief"><svg class="vessel" viewBox="0 0 600 150" role="img" aria-label="Schematische Arterienverengung"><path d="M10 35H590M10 115H590" stroke="#86baff" stroke-width="12"/><path id="plaque" fill="#ffb98b"/><path d="M20 75H580" stroke="#77f2c3" stroke-width="5" class="flowline"/></svg><label for="stenosis">Verengung untersuchen</label><input id="stenosis" class="slider" type="range" min="0" max="80" value="0"><div class="readout"><span id="stenosisLabel">0 % Verengung</span><span>Schematisches Modell</span></div></div>`:'')+`<div class="choices" role="group" aria-label="Antwortmöglichkeiten">${shuffle(q.options.map((_,i)=>i)).map(i=>`<button class="choice" data-i="${i}" aria-pressed="false"><span class="marker">${q.type==='multi'?'＋':'○'}</span><span>${esc(q.options[i])}</span></button>`).join('')}</div>`;el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(checked)return;let i=Number(b.dataset.i);chosen=q.type==='multi'?(chosen.includes(i)?chosen.filter(x=>x!==i):[...chosen,i]):[i];el.querySelectorAll('.choice').forEach(x=>{let selected=chosen.includes(Number(x.dataset.i));x.classList.toggle('selected',selected);x.setAttribute('aria-pressed',selected);x.querySelector('.marker').textContent=selected?'✓':q.type==='multi'?'＋':'○'})});if(q.type==='sim'){let slider=document.getElementById('stenosis');slider.oninput=()=>{touched=true;let n=Number(slider.value);document.getElementById('stenosisLabel').textContent=n+' % Verengung';document.getElementById('plaque').setAttribute('d',`M195 35 Q300 ${35+n} 405 35 Z M195 115 Q300 ${115-n} 405 115 Z`)};document.getElementById('plaque').setAttribute('d','M195 35H405Z')}}
function paintOrder(){document.getElementById('task').innerHTML='<p class="muted">Nutze ↑ und ↓. Die Karten sind gemischt.</p>'+order.map((id,i)=>`<div class="order"><b style="color:var(--mint)">${i+1}</b><span>${esc(Q[currentIndex()].options[id])}</span><button data-i="${i}" data-dir="-1" ${i===0?'disabled':''} aria-label="Karte ${i+1} nach oben">↑</button><button data-i="${i}" data-dir="1" ${i===order.length-1?'disabled':''} aria-label="Karte ${i+1} nach unten">↓</button></div>`).join('');document.querySelectorAll('.order button').forEach(b=>b.onclick=()=>{if(checked)return;let i=Number(b.dataset.i),j=i+Number(b.dataset.dir);[order[i],order[j]]=[order[j],order[i]];paintOrder();let focus=document.querySelector(`.order button[data-i="${j}"][data-dir="${b.dataset.dir}"]`);if(focus&&!focus.disabled)focus.focus()})}
function check(){if(checked)return;let q=Q[currentIndex()];if(q.type==='match'&&(chosen.length!==q.options.length||q.options.some((_,i)=>chosen[i]===undefined))){document.getElementById('validation').textContent='Ordne bitte jede Karte zu.';return}if(q.type!=='match'&&q.type!=='order'&&!chosen.length){document.getElementById('validation').textContent='Wähle zuerst eine Antwort.';return}if(q.type==='sim'&&!touched){document.getElementById('validation').textContent='Untersuche zuerst die Verengung mit dem Regler.';return}let answer=q.type==='order'?order:chosen;let ok=q.type==='order'||q.type==='match'?answer.length===q.answer.length&&answer.every((v,i)=>v===q.answer[i]):answer.length===q.answer.length&&answer.every(v=>q.answer.includes(v));checked=true;if(state.phase==='play'){state.results[state.pos]={ok,mastered:ok};}else if(ok){state.results[currentIndex()].mastered=true}document.getElementById('check').disabled=true;document.getElementById('validation').textContent='';document.querySelectorAll('#task button,#task select,#task input').forEach(e=>e.disabled=true);let solution=q.type==='match'?q.options.map((o,i)=>`<li>${esc(o)} → <b>${esc(q.labels[q.answer[i]])}</b></li>`).join(''):q.answer.map(i=>`<li>${esc(q.options[i])}</li>`).join('');document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><h3>${ok?(state.phase==='retry'?'Code im Training geknackt.':'Flow stabilisiert. +100 XP'):'Noch eine Lücke im Netz.'}</h3><p>${esc(q.explain)}</p>${!ok?`<p><b>So passt es zusammen:</b></p><${q.type==='order'?'ol':'ul'}>${solution}</${q.type==='order'?'ol':'ul'}><p class="muted">Diese Challenge kannst du am Ende erneut spielen.</p>`:''}<button class="primary" id="next">${state.phase==='play'&&state.pos===Q.length-1?'Missionsbericht öffnen ↗':'Weiter ↗'}</button></div>`;document.getElementById('next').onclick=()=>{save();if(state.phase==='retry'){state.retry++;if(state.retry>=state.queue.length)state.phase='result'}else{state.pos++;if(state.pos>=Q.length)state.phase='result'}save();render()};document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'nearest'});document.getElementById('next').focus({preventScroll:true});save()}
function result(){state.phase='result';save();let n=state.results.filter(r=>r.ok).length,mastered=state.results.filter(r=>r.mastered).length;let missing=state.results.flatMap((r,i)=>r.mastered?[]:[i]);app.innerHTML=`<div class="tag" style="color:var(--mint)">Mission abgeschlossen · dein Gefässnetz</div><h1 style="font-size:clamp(42px,6vw,70px)">${n>=20?'Du hältst den Flow.':n>=14?'Dein Netz steht.':'Dein Wissen wächst.'}</h1><div class="question"><div class="bigscore">${n*100} <span style="font-size:24px;letter-spacing:0">XP</span></div><p>${n} von ${Q.length} Challenges beim ersten Versuch gelöst · ${mastered} inklusive Training gemeistert.</p><p class="muted">Spielzeit: ${Math.floor(state.elapsed/60)} min ${state.elapsed%60} s. Dein Erstversuch bleibt sichtbar; Training verbessert deinen Lernstand.</p><div class="resultgrid">${sectors.map((s,i)=>{let ids=Q.flatMap((q,j)=>q.s===i?[j]:[]);return `<div class="card"><span class="tag">0${i+1}</span><h3>${s}</h3><b style="color:var(--mint)">${ids.filter(j=>state.results[j]?.mastered).length} / ${ids.length}</b><p>inkl. Training</p></div>`}).join('')}</div><div class="brief"><h3>Dein Transfer in die Praxis</h3><p>Nenne für dich einen beeinflussbaren Gefässrisikofaktor und eine konkrete Handlung für diese Woche. Keine persönlichen Gesundheitsdaten eingeben.</p><p class="muted">Erkläre danach laut in 30 Sekunden: Warum macht ein venöses Hindernis eher ein dickes Bein, ein arterielles eher einen kalten Fuss?</p></div>${missing.length?`<h3>Hier lohnt sich die nächste Runde:</h3><ul>${missing.map(i=>'<li>'+esc(Q[i].title)+'</li>').join('')}</ul>`:'<h3 style="color:var(--mint)">Alle Codes geknackt. Starkes Gefässnetz.</h3>'}<div class="actions">${missing.length?'<button class="primary" id="retry">Offene Challenges trainieren ↗</button>':''}<button id="restart">Neue Mission</button><button id="print">Bericht drucken / PDF</button></div></div>${sources()}`;if(document.getElementById('retry'))document.getElementById('retry').onclick=()=>{state.queue=missing;state.retry=0;state.phase='retry';clockStart=Date.now();save();render()};document.getElementById('restart').onclick=reset;document.getElementById('print').onclick=()=>window.print();window.scrollTo({top:0,behavior:'instant'})}
function tick(){let el=document.getElementById('timer');if(el){let t=time();el.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}}setInterval(tick,1000);window.addEventListener('pagehide',save);render();
</script></body></html>
